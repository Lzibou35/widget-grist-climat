<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

<script>
grist.ready({requiredAccess:"full"});

async function test() {
  try {
    console.log("TEST A : accès à la table principale");

    const parentTable =
      grist.getTable("Etat_des_lieux_donnees_CAEC");

    console.log("OK parent :", parentTable);

    console.log("TEST B : accès à la table Jeux_de_donnees");

    const childTable =
      grist.getTable("Jeux_de_donnees");

    console.log("OK enfant :", childTable);

    alert("OK : les deux tables sont accessibles.");
  }
  catch(e) {
    console.error("ERREUR :", e);
    alert("ERREUR : " + (e.message || e));
  }
}

window.addEventListener("load", test);
</script>
