<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

<script>
grist.ready({requiredAccess:"full"});

async function testGrist() {
  try {
    console.log("TEST 1 : accès à Grist");

    const table = grist.getTable("Etat_des_lieux_donnees_CAEC");

    console.log("TEST 2 : table récupérée");

    const result = await table.create([{
      Prenom: "TEST",
      Nom: "TEST",
      Pole: "TEST"
    }]);

    console.log("TEST 3 : ligne créée", result);

    alert("TEST OK : ligne créée dans Grist");
  }
  catch(e) {
    console.error("ERREUR TEST :", e);
    alert("ERREUR : " + (e.message || e));
  }
}

window.addEventListener("load", testGrist);
</script>
