<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

<script>
grist.ready({requiredAccess:"full"});

async function test() {
  try {
    console.log("TEST : création dans Jeux_de_donnees");

    const childTable = grist.getTable("Jeux_de_donnees");

    const result = await childTable.create([{
      Donnee: "TEST_ENFANT",
      Theme: "Climat",
      Pole: "Stratégie",
      Description_Facultatif: "Test écriture table enfant",
      Niveau_de_confidentialite: "1 : Donnée publique diffusable à l’externe"
    }]);

    console.log("Résultat :", result);

    alert("OK : ligne créée dans Jeux_de_donnees !");
  }

  catch(e) {
    console.error("ERREUR :", e);
    alert("ERREUR : " + (e.message || e));
  }
}

window.addEventListener("load", test);
</script>
