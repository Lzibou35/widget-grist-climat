<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test accès Grist</title>

<script src="https://grist.numerique.gouv.fr/grist-plugin-api.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  padding: 30px;
}

button {
  padding: 12px 20px;
  font-size: 16px;
  cursor: pointer;
}

pre {
  margin-top: 20px;
  padding: 15px;
  background: #f1f1f1;
  white-space: pre-wrap;
}
</style>
</head>

<body>

<h2>Test accès API Grist</h2>

<button id="test">Tester l'accès</button>

<pre id="result">En attente…</pre>

<script>

grist.ready({
  requiredAccess: "full"
});

document.getElementById("test").addEventListener("click", async () => {

  const result = document.getElementById("result");

  try {

    result.textContent = "Obtention du jeton…";

    console.log("grist =", grist);
    console.log("getAccessToken =", grist.getAccessToken);

    const tokenInfo = await grist.getAccessToken({
      readOnly: false
    });

    console.log("TOKEN INFO =", tokenInfo);

    result.textContent =
      "✅ JETON OBTENU\n\n" +
      "baseUrl : " + tokenInfo.baseUrl + "\n\n" +
      "ttlMsecs : " + tokenInfo.ttlMsecs;

  } catch (e) {

    console.error("ERREUR =", e);

    result.textContent =
      "❌ ERREUR\n\n" +
      (e.message || e);

  }

});

</script>

</body>
</html>
