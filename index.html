<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Test Grist</title>

<script src="https://grist.numerique.gouv.fr/grist-plugin-api.js"></script>
<style>
body {
  font-family: Arial, sans-serif;
  padding: 30px;
}

button {
  padding: 12px 20px;
  font-size: 16px;
  cursor: pointer;
}

#result {
  margin-top: 20px;
  padding: 15px;
  background: #f1f1f1;
}
</style>
</head>

<body>

<h2>Test écriture Jeux_de_donnees</h2>

<button id="test">
Créer une ligne de test
</button>

<div id="result">
En attente du test…
</div>

<script>

grist.ready({
  requiredAccess: "full"
});

const button = document.getElementById("test");
const result = document.getElementById("result");

button.addEventListener("click", async function() {

  result.textContent = "Création en cours…";
  button.disabled = true;

  try {

    console.log("TEST : début");

    const table = grist.getTable("Jeux_de_donnees");

    console.log("TEST : table obtenue", table);

    const lignes = await table.create([{

      Donnee: "TEST_ENFANT",

      Theme: "Climat",

      Pole: "Stratégie",

      Description_Facultatif: "Test écriture table enfant",

      Niveau_de_confidentialite:
        "1 : Donnée publique diffusable à l’externe"

    }]);

    console.log("TEST : résultat création", lignes);

    result.textContent =
      "✅ Ligne créée dans Jeux_de_donnees !";

  }

  catch (e) {

    console.error("TEST : ERREUR", e);

    result.textContent =
      "❌ ERREUR : " + (e.message || e);

  }

  button.disabled = false;

});

</script>

</body>
</html>
