<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Test Grist</title>

<script src="https://grist.numerique.gouv.fr/grist-plugin-api.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  padding: 30px;
}

button {
  padding: 12px 20px;
  font-size: 16px;
}

#result {
  margin-top: 20px;
  padding: 15px;
  background: #f1f1f1;
  white-space: pre-wrap;
}
</style>
</head>

<body>

<h2>Test AddRecord</h2>

<button id="test">Créer TEST_APPLY</button>

<div id="result">En attente…</div>

<script>

grist.ready({
  requiredAccess: "full"
});

const button = document.getElementById("test");
const result = document.getElementById("result");

button.addEventListener("click", async () => {

  button.disabled = true;
  result.textContent = "Création en cours…";

  try {

    console.log("grist =", grist);
    console.log("docApi =", grist.docApi);

    const actions = [[
      "AddRecord",
      "Jeux_de_donnees",
      null,
      {
        Donnee: "TEST_APPLY",
        Theme: "Climat",
        Pole: "Stratégie",
        Description_Facultatif: "Test AddRecord",
        Niveau_de_confidentialite:
          "1 : Donnée publique diffusable à l’externe"
      }
    ]];

    const response =
      await grist.docApi.applyUserActions(actions);

    console.log("REPONSE :", response);

    result.textContent =
      "✅ AddRecord exécuté.\n\n" +
      JSON.stringify(response, null, 2);

  } catch (e) {

    console.error("ERREUR :", e);

    result.textContent =
      "❌ ERREUR :\n\n" +
      (e.message || e);

  }

  button.disabled = false;
});

</script>

</body>
</html>
