<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test Grist</title>

<script src="https://grist.numerique.gouv.fr/grist-plugin-api.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  padding: 30px;
}

button {
  padding: 12px 20px;
  font-size: 16px;
}

pre {
  margin-top: 20px;
  padding: 15px;
  background: #f1f1f1;
  white-space: pre-wrap;
}
</style>
</head>

<body>

<h2>Test Jeux_de_donnees</h2>

<button id="test">
Créer puis relire
</button>

<pre id="result">En attente…</pre>

<script>

grist.ready({
  requiredAccess: "full"
});

document.getElementById("test").addEventListener("click", async () => {

  const result = document.getElementById("result");

  try {

    result.textContent = "Création en cours…";

    const table = grist.getTable("Jeux_de_donnees");

    // 1. Création
    const created = await table.create([{
      Donnee: "TEST_ENFANT_001",
      Theme: "Climat",
      Pole: "Stratégie",
      Description_Facultatif: "TEST DESCRIPTION",
      Niveau_de_confidentialite:
        "1 : Donnée publique diffusable à l’externe"
    }]);

    console.log("CREATE =", created);

    // 2. Relecture immédiate de la table
    const data =
      await grist.raw.docApi.fetchTable("Jeux_de_donnees");

    console.log("FETCH =", data);

    result.textContent =
      "CREATE :\n" +
      JSON.stringify(created, null, 2) +
      "\n\nFETCH TABLE :\n" +
      JSON.stringify(data, null, 2);

  }

  catch (e) {

    console.error(e);

    result.textContent =
      "ERREUR :\n" +
      (e.message || e);

  }

});

</script>

</body>
</html>
